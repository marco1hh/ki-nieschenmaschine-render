name: Render Video

on:
repository_dispatch:
types: [render]

permissions:
contents: write

jobs:
render:
runs-on: ubuntu-latest
steps:
- name: Repository auschecken
uses: actions/checkout@v4

- name: Python 3.11 einrichten
uses: actions/setup-python@v5
with:
python-version: "3.11"

- name: Abhaengigkeiten installieren
run: |
sudo apt-get update
sudo apt-get install -y ffmpeg
pip install edge-tts requests

- name: Sprachausgabe erzeugen (edge-tts)
env:
SPRECHERTEXT: ${{ github.event.client_payload.sprechertext }}
run: |
edge-t
