name: Render Video

on:
repository_dispatch:
types: [render]

jobs:
render:
runs-on: ubuntu-latest
steps:
- name: Repository auschecken
uses: actions/checkout@v4

- name: Python einrichten
uses: actions/setup-python@v5
with:
python-version: "3.11"

- name: Abhängigkeiten installieren
run: |
sudo apt-get update
sudo apt-get install -y ffmpeg
pip install edge-tts requests

- name: Sprachausgabe erzeugen
run: |
edge-tts --voice de-DE-ConradNeural --text "${{ github.event.client_payload.sprechertext }}" --write-media audio.mp3

- name: Bild herunterladen
run: |
curl -L "${{ github.event.client_payload.image_url }}" -o image.jpg

- name: Video rendern
run: |
ffmpeg -loop 1 -i image.jpg -i audio.mp3 -c:v libx264 -tune stillimage \
-c:a aac -b:a 192k -pix_fmt yuv420p -shortest \
-vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" \
output.mp4

- name: GitHub Release erstellen
env:
GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
run: |
TAG="render-${{ github.run_id }}"
gh release create "$TAG" output.mp4 --title "$TAG" --notes "Automatisch gerendertes Video"
DOWNLOAD_URL=$(gh release view "$TAG" --json assets --jq '.assets[0].browser_download_url')
echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV

- name: Callback an n8n senden
run: |
curl -X POST "${{ github.event.client_payload.callback_url }}" \
-H "Content-Type: application/json" \
-d "{\"production_id\": \"${{ github.event.client_payload.production_id }}\", \"video_url\": \"${{ env.DOWNLOAD_URL }}\"}"
